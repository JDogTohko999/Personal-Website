<!DOCTYPE html>
<html lang="en" data-theme="japandi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jason Chin</title>
    <script>
      // Apply the stored theme before first paint (no flash). Keep in sync with src/theme/useTheme.js.
      (function () {
        try {
          var t = localStorage.getItem('jc-theme');
          if (['japandi', 'japandi-night', 'earth', 'earth-dusk'].indexOf(t) > -1) {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // The named palettes added later (clay, moss, sand, herb, walnut; japandi is above). Kept as
      // a separate block so directions that trimmed the list above merge cleanly: drop any ids
      // you don't offer. Keep in sync with THEMES in src/theme/useTheme.js.
      (function () {
        try {
          var t = localStorage.getItem('jc-theme');
          if (['clay', 'moss', 'sand', 'herb', 'walnut'].indexOf(t) > -1) {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
