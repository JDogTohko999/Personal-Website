<!doctype html>

<title>Jason-ing preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:40px 24px 64px; background:#232036; color:#F4F2F8;
         font:15px/1.6 Inter, system-ui, sans-serif; }
  h1 { font-size:26px; margin:0 0 6px; }
  p.sub { color:#A49FBA; margin:0 0 36px; max-width:720px; }
  .grid { display:grid; gap:34px 28px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
          max-width:1200px; margin:0 auto; }
  .card { margin:0; }
  .circle { width:192px; height:192px; border-radius:50%; overflow:hidden;
            border:4px solid #C9A94F; box-shadow:0 10px 30px rgba(0,0,0,.45); margin:0 auto 12px; }
  .circle img, .circle video { width:100%; height:100%; object-fit:cover; display:block; }
  .full { width:192px; margin:0 auto 10px; background:#15122a; border:1px solid #3a3550; border-radius:6px; }
  .full img, .full video { width:100%; height:auto; display:block; border-radius:5px; opacity:.8; }
  figcaption { text-align:center; }
  .label { display:block; font-weight:600; }
  .note { display:block; font-size:12px; color:#A49FBA; }
  .note b { color:#E8A0A0; font-weight:600; }
</style>
