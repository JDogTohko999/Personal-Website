  <div id="controls">
    <span>Show:</span>
    <button class="toggle-btn active" id="btn-vaisi"   onclick="toggle('vaisi')">VAISI</button>
    <button class="toggle-btn" id="btn-sai"     onclick="toggle('sai')">SAI</button>
    <button class="toggle-btn" id="btn-sacks"   onclick="toggle('sacks')">UVA Sacks</button>
    <button class="toggle-btn" id="btn-bestfit" onclick="toggle('bestfit')">Best Fit</button>
  </div>
  <script>
    const state = { vaisi: true, sai: false, sacks: false, bestfit: false };

    const ranges = {
      vaisi: ['2025-09-22T18:01:51', '2026-03-30T14:13:01'],
      sai:   ['2024-09-09T11:55:50', '2026-03-31T00:06:49'],
      sacks: ['2024-10-24T19:13:08', '2026-03-29T10:24:23'],
    };

    const rates = {
      vaisi: 23.1,
      sai:   11.2,
      sacks: 6.9,
    };

    function computeTitle() {
      const parts = [];
      if (state.bestfit && state.vaisi) parts.push('VAISI: '     + rates.vaisi + '/mo');
      if (state.bestfit && state.sai)   parts.push('SAI: '       + rates.sai   + '/mo');
      if (state.bestfit && state.sacks) parts.push('UVA Sacks: ' + rates.sacks + '/mo');
      const sub = parts.length ? '<br><sup>' + parts.join(' &nbsp;|&nbsp; ') + ' &nbsp;(dashed = best fit)</sup>' : '';
      return 'GroupMe Membership Over Time' + sub;
    }

    function computeXRange() {
      const active = [];
      if (state.vaisi) active.push('vaisi');
      if (state.sai)   active.push('sai');
      if (state.sacks) active.push('sacks');
      if (active.length === 0) return [new Date(ranges.vaisi[0]), new Date(ranges.vaisi[1])];
      const mins = active.map(k => new Date(ranges[k][0]));
      const maxs = active.map(k => new Date(ranges[k][1]));
      return [new Date(Math.min(...mins)), new Date(Math.max(...maxs))];
    }

    // Trace index map:
    // 0  VAISI best fit
    // 1  SAI best fit
    // 2  UVA Sacks best fit
    // 3  VAISI step
    // 4  VAISI join dots
    // 5  VAISI leave dots
    // 6  SAI step
    // 7  SAI join dots
    // 8  SAI leave dots
    // 9  UVA Sacks step
    // 10 UVA Sacks join dots
    // 11 UVA Sacks leave dots

    function getDiv() {
      return document.querySelector('.plotly-graph-div');
    }

    function applyVisibility() {
      const div = getDiv();
      const visible = [
        state.bestfit && state.vaisi,  // 0  VAISI best fit
        state.bestfit && state.sai,    // 1  SAI best fit
        state.bestfit && state.sacks,  // 2  UVA Sacks best fit
        state.vaisi,                   // 3  VAISI step
        state.vaisi,                   // 4  VAISI join dots
        state.vaisi,                   // 5  VAISI leave dots
        state.sai,                     // 6  SAI step
        state.sai,                     // 7  SAI join dots
        state.sai,                     // 8  SAI leave dots
        state.sacks,                   // 9  UVA Sacks step
        state.sacks,                   // 10 UVA Sacks join dots
        state.sacks,                   // 11 UVA Sacks leave dots
      ];
      const data = visible.map(v => ({ visible: v }));
      const [xMin, xMax] = computeXRange();
      Plotly.animate(div,
        {
          data,
          traces: visible.map((_, i) => i),
          layout: { xaxis: { range: [xMin, xMax], autorange: false }, title: { text: computeTitle() } }
        },
        { transition: { duration: 500, easing: 'cubic-in-out' }, frame: { duration: 500 } }
      );
    }

    function toggle(key) {
      state[key] = !state[key];
      document.getElementById('btn-' + key).classList.toggle('active', state[key]);
      applyVisibility();
    }
  </script>
