<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noimageindex">
<title>Purity Pool · Archive</title><style>
:root{--bg:#0f1115;--card:#181b22;--fg:#f2f2f2;--mut:#9aa3b2;--gold:#ffc83d;--red:#ff5a5a;--line:#2a2f3a}
